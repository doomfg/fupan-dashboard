<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六张网项目追踪仪表盘</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:#f5f7fa; color:#1f2937; padding:20px; }
  header { max-width:1200px; margin:0 auto 20px; }
  h1 { font-size:24px; display:flex; align-items:center; gap:10px; }
  h1 .dot { width:12px; height:12px; border-radius:50%; background:#2563eb; }
  .sub { color:#6b7280; font-size:13px; margin-top:6px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; max-width:1200px; margin:0 auto 20px; }
  .stat { background:#fff; border-radius:12px; padding:16px; border:1px solid #e5e7eb; }
  .stat .num { font-size:28px; font-weight:700; color:#2563eb; }
  .stat .lbl { font-size:13px; color:#6b7280; margin-top:4px; }
  .filters { display:flex; flex-wrap:wrap; gap:12px; max-width:1200px; margin:0 auto 16px; align-items:center; background:#fff; padding:14px; border-radius:12px; border:1px solid #e5e7eb; }
  .filters select, .filters input { padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; background:#fff; }
  .filters input { flex:1; min-width:180px; }
  #list { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
  .card { background:#fff; border-radius:12px; padding:16px; border:1px solid #e5e7eb; display:flex; flex-direction:column; gap:10px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
  .card .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .tag { font-size:12px; padding:3px 10px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .net-tag-water { background:#dbeafe; color:#1d4ed8; }
  .net-tag-新型电网 { background:#fef3c7; color:#b45309; }
  .net-tag-算力网 { background:#d1fae5; color:#047857; }
  .net-tag-新一代通信网 { background:#e0e7ff; color:#4338ca; }
  .net-tag-城市地下管网 { background:#fce7f3; color:#be185d; }
  .net-tag-物流网 { background:#e5e7eb; color:#374151; }
  .prov { font-size:12px; background:#eff6ff; color:#2563eb; padding:3px 10px; border-radius:20px; border:1px solid #bfdbfe; }
  .card h3 { font-size:16px; line-height:1.4; }
  .meta { font-size:13px; color:#6b7280; display:flex; flex-wrap:wrap; gap:6px 14px; }
  .meta b { color:#111827; font-weight:600; }
  .amount { color:#047857; font-weight:700; }
  .detail { font-size:13px; color:#374151; line-height:1.5; }
  .src { font-size:12px; color:#9ca3af; text-align:right; }
  .src a { color:#2563eb; text-decoration:none; }
  .status { font-size:12px; padding:3px 8px; border-radius:6px; background:#f3f4f6; color:#4b5563; }
  .empty { text-align:center; color:#9ca3af; padding:40px; grid-column:1/-1; }
  .foot { max-width:1200px; margin:24px auto 0; font-size:12px; color:#9ca3af; text-align:center; }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>六张网项目追踪仪表盘</h1>
  <div class="sub">追踪项目落地情况 · 落省份 · 订单归属公司（数据更新：<span id="updated"></span>，公开渠道采集，非完整清单）</div>
</header>

<div class="stats" id="stats"></div>

<div class="filters">
  <select id="fNet"></select>
  <select id="fProv"></select>
  <select id="fStatus"></select>
  <input id="fSearch" placeholder="🔍 搜索项目/公司名…">
  <span id="count" style="font-size:13px;color:#6b7280;margin-left:auto;"></span>
</div>

<div id="list"></div>
<div class="foot">数据来源于公开招标公告、政府公文及权威媒体报道；主体类型区分「中标供应商 / 建设单位 / 招标人 / 运营方」。仅供追踪参考。</div>

<script src="data.js"></script>
<script>
  const D = LIUZHANGWANG_DATA;
  const networks = D.networks;
  document.getElementById('updated').textContent = D.updated;

  // 汇总所有项目
  const all = [];
  networks.forEach(n => n.projects.forEach(p => {
    p._net = n.name; all.push(p);
  }));
  const provs = [...new Set(all.map(p=>p.province))].sort();
  const stats = [...new Set(all.map(p=>p.status))].sort();

  // 统计
  function renderStats(){
    const provSet = new Set(all.flatMap(p=>p.province.split('/').map(s=>s.trim())));
    const card = (num,lbl)=>`<div class="stat"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`;
    document.getElementById('stats').innerHTML =
      card(all.length,'登记项目数')+
      card(provSet.size,'覆盖省份数')+
      card(networks.length,'六张网')+
      card(all.filter(p=>!/公示/.test(p.status)&&!/中标公告|成交/.test(p.status)).length,'在推进项目数');
  }

  // 过滤器
  function initFilters(){
    const fNet=document.getElementById('fNet');
    fNet.innerHTML='<option value="">全部领域</option>'+networks.map(n=>`<option>${n.name}</option>`).join('');
    const fProv=document.getElementById('fProv');
    fProv.innerHTML='<option value="">全部省份</option>'+provs.map(p=>`<option>${p}</option>`).join('');
    const fStatus=document.getElementById('fStatus');
    fStatus.innerHTML='<option value="">全部状态</option>'+stats.map(s=>`<option>${s}</option>`).join('');
  }

  function filtered(){
    const n=document.getElementById('fNet').value;
    const pr=document.getElementById('fProv').value;
    const st=document.getElementById('fStatus').value;
    const q=document.getElementById('fSearch').value.trim().toLowerCase();
    return all.filter(p=>
      (!n||p._net===n)&&(!pr||p.province===pr)&&(!st||p.status===st)&&
      (!q||(p.name+p.company+p.detail).toLowerCase().includes(q))
    );
  }

  function render(){
    const list=filtered();
    document.getElementById('count').textContent=`${list.length} / ${all.length} 个项目`;
    const box=document.getElementById('list');
    if(!list.length){ box.innerHTML='<div class="empty">没有符合条件的项目</div>'; return; }
    box.innerHTML=list.map(p=>{
      const src=p.url?`<a href="${p.url}" target="_blank">来源</a>`:'—';
      return `<div class="card">
        <div class="top">
          <span class="tag net-tag-${p._net}">${p._net}</span>
          <span class="prov">📍 ${p.province}${p.city?' · '+p.city:''}</span>
        </div>
        <h3>${p.name}</h3>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="status">${p.status}</span>
          ${p.amount?`<span class="amount">${p.amount}</span>`:''}
        </div>
        <div class="meta">
          ${p.company?`<span>${p.companyRole}：<b>${p.company}</b></span>`:''}
          ${p.date?`<span>时间：<b>${p.date}</b></span>`:''}
        </div>
        <div class="detail">${p.detail}</div>
        <div class="src">数据时间 ${p.date} · ${src}</div>
      </div>`;
    }).join('');
  }

  ['fNet','fProv','fStatus','fSearch'].forEach(id=>document.getElementById(id).addEventListener('change',render));
  document.getElementById('fSearch').addEventListener('input',render);
  renderStats(); initFilters(); render();
</script>
</body>
</html>
